<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auszeit</title>
    <link rel="stylesheet" href="/auszeit-display/static/css/display_pages/base_display.css">
    <style>
        .fallback-content {
            display: flex;
            align-items: center;
            height: 100%;
            max-width: 1050px;
            padding-bottom: 90px;
        }

        .fallback-title {
            margin: 0;
            color: #f1d27a;
            font-size: clamp(58px, 6vw, 108px);
            font-weight: 600;
            letter-spacing: 0.02em;
            text-shadow: 0 3px 18px rgba(0, 0, 0, 0.45);
        }

        .fallback-text {
            margin: 24px 0 0;
            font-size: clamp(28px, 2.5vw, 46px);
            line-height: 1.25;
        }
    </style>
</head>
<body>
    <div class="display-background"></div>
    <img class="display-logo" src="/auszeit-display/resources/images/logo.png" alt="Café Restaurant Auszeit">

    <main class="display-content fallback-content">
        <div>
            <h1 class="fallback-title">Willkommen in der Auszeit</h1>
            <p class="fallback-text">Wir wünschen einen angenehmen Aufenthalt.</p>
        </div>
    </main>
</body>
</html>
