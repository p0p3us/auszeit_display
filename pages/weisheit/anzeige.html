<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auszeit-Weisheit</title>

  <link rel="stylesheet" href="/auszeit-display/static/css/display_pages/base_display.css">
  
  <link rel="stylesheet" href="/auszeit-display/static/css/display_pages/weisheit.css">

</head>
<body>
  <div class="display-background"></div>

  <img class="display-logo" src="/auszeit-display/resources/images/logo.png" alt="Café Auszeit">

  
  <img class="display-topic-image weisheit-image" src="/auszeit-display/resources/images/weisheit.png" alt="">


  <main class="display-content">
    
  <section class="weisheit-card">
    <div class="weisheit-kicker">Täglich frisch eingeschenkt</div>
    <h1>Auszeit-Weisheit</h1>

    <blockquote class="weisheit-text" aria-label="„Verliert der Bauer seine Hose,
war bestimmt der Gummi lose.“">
      <span class="weisheit-line">„Verliert der Bauer seine Hose,</span>
      <span class="weisheit-line">war bestimmt der Gummi lose.“</span>
    </blockquote>
  </section>

  <script>
    (() => {
      const text = document.querySelector('.weisheit-text');
      const card = document.querySelector('.weisheit-card');
      if (!text || !card) return;

      const lines = [...text.querySelectorAll('.weisheit-line')];
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      let size = 88;
      const minimum = 48;

      const layoutLines = () => {
        text.style.fontSize = `${size}px`;
        const style = getComputedStyle(text);
        context.font = `${style.fontWeight} ${size}px ${style.fontFamily}`;

        lines.forEach((line) => {
          line.classList.remove('weisheit-line-wrap');
          line.style.width = '';
        });

        const widths = lines.map((line) => context.measureText(line.textContent).width);
        const wrapAll = widths.some((width) => width > text.clientWidth);

        if (wrapAll) {
          lines.forEach((line, index) => {
            line.classList.add('weisheit-line-wrap');
            line.style.width = `${Math.ceil(widths[index] * 0.58)}px`;
          });
        }
      };

      layoutLines();
      while (size > minimum && card.scrollHeight > card.clientHeight) {
        size -= 2;
        layoutLines();
      }
    })();
  </script>

  </main>

  </footer>-->
</body>
</html>
