<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Wetter morgen</title>

  <link rel="stylesheet" href="/auszeit-display/static/css/display_pages/base_display.css">
  <link rel="stylesheet" href="/auszeit-display/static/css/display_pages/weather.css">
</head>

<body>
  <main class="display-page weather-page weather-tomorrow-page">
    <img class="display-logo" src="/auszeit-display/resources/images/logo.png" alt="Auszeit">

    <section class="display-content">
      <article class="weather-tomorrow-card">
        <div class="weather-kicker">{{ location }}</div>
        <h1>Wetter morgen</h1>

        <div class="weather-date">
          {{ day.weekday }}, {{ day.date_display }}
        </div>

        <div class="weather-tomorrow-main">
          <div class="weather-temperature">
            {{ day.temp_max }}°
          </div>

          <div class="weather-icon-wrap">
            <img class="weather-main-icon" src="{{ day.icon_path }}" alt="">
          </div>
        </div>

        <div class="weather-description">
          {{ day.description }}
        </div>

        <div class="weather-details">
          <div>
            <span>Min.</span>
            <strong>{{ day.temp_min }}°</strong>
          </div>
          <div>
            <span>Regen</span>
            <strong>{{ day.rain_probability }}%</strong>
          </div>
          <div>
            <span>Wind</span>
            <strong>{{ day.wind_kmh }} km/h</strong>
          </div>
          <div>
            <span>Feuchte</span>
            <strong>{{ day.humidity }}%</strong>
          </div>
        </div>

        <div class="weather-updated">
          Aktualisiert: {{ updated }}
        </div>
      </article>
    </section>
  </main>
</body>
</html>
